# AI-Model-Signature: gpt-5.6-sol | 2026-08-22 | 临时自动准备 v0.7.5 发布文件并回写功能分支
name: Test userscript

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare v0.7.5 release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/block-bilibili-promotions'
        run: node scripts/release-v0.7.5.mjs
      - name: Run syntax, core and browser tests
        run: node tests/run-all.mjs
      - name: Commit generated release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/block-bilibili-promotions'
        run: |
          if git diff --quiet; then
            echo "No generated release changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parts/00-bootstrap.js README.md CHANGELOG.md GREASYFORK_DESCRIPTION.html bilibili-ai-up-filter.user.js
          git commit -m "chore(release): prepare v0.7.5"
          git push origin HEAD:feat/block-bilibili-promotions
